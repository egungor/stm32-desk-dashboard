name: Integration CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S tests/integration -B build/integration

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/integration --config Debug 2>&1 | tee build.log || {
            grep -E "error|warning C" build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Test
        run: ctest --test-dir build/integration --build-config Debug --output-on-failure
