name: Firmware CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'firmware/**'
      - 'tools/build-firmware-linux.sh'
      - '.github/workflows/firmware-ci.yml'
      - '.gitmodules'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/build-firmware-linux.sh'
      - '.github/workflows/firmware-ci.yml'
      - '.gitmodules'

# On a v* tag the Release build is also attached to the GitHub release as
# .elf, .hex and .bin (the installer workflow attaches the setup).
permissions:
  contents: write  # attach the firmware to a release (tags only)

# Toolchain versions follow docs/toolchain.md ("Linux build (secondary)").
env:
  GCC_ARCHIVE: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
  GCC_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
  CMAKE_ARCHIVE: cmake-3.26.3-linux-x86_64.tar.gz
  CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v3.26.3/cmake-3.26.3-linux-x86_64.tar.gz
  NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip

jobs:
  firmware:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache toolchain archives
        id: cache
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ env.GCC_ARCHIVE }}-${{ env.CMAKE_ARCHIVE }}-ninja-1.13.2

      - name: Download toolchain archives
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchain
          curl -fsSL --retry 3 -o ".toolchain/$GCC_ARCHIVE" "$GCC_URL"
          curl -fsSL --retry 3 -o ".toolchain/$CMAKE_ARCHIVE" "$CMAKE_URL"
          curl -fsSL --retry 3 -o .toolchain/ninja-linux.zip "$NINJA_URL"

      - name: Build
        run: tools/build-firmware-linux.sh ${{ matrix.build_type }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.build_type }}
          path: |
            firmware/STM32AudioController/build/linux-${{ matrix.build_type }}/STM32AudioController.elf
            firmware/STM32AudioController/build/linux-${{ matrix.build_type }}/STM32AudioController.map
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.build_type == 'Release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          objcopy="$HOME/.cache/stm32-tools/gcc/bin/arm-none-eabi-objcopy"
          out="firmware/STM32AudioController/build/linux-Release"
          name="stm32-audio-controller-firmware-${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp "$out/STM32AudioController.elf" "release/$name.elf"
          "$objcopy" -O ihex "$out/STM32AudioController.elf" "release/$name.hex"
          "$objcopy" -O binary "$out/STM32AudioController.elf" "release/$name.bin"
          # A tag with a "-" (v0.7.0-beta.1) makes a pre-release. The
          # installer workflow may create the release at the same time, so
          # upload, else create, else upload again.
          pre=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre="--prerelease"; fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber ||
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes $pre ||
            { sleep 15; gh release upload "$GITHUB_REF_NAME" release/* --clobber; }
