<!doctype html>
<!-- The settings window's page (ADR-011, #61): a resource of dashboard-tray,
     shown in WebView2. It talks to the program only through
     chrome.webview.postMessage (requests) and "message" events (state);
     host/App/SettingsModel.h lists both. No network, no external files. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https://pictures.desk-dashboard">
<title>Settings</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1d2430; --muted: #5c6675; --line: #e1e4e9;
  --accent: #e8833f; --accent-text: #14202b; --danger: #c43c3c; --ok: #2f8a57; --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191f; --panel: #1e242c; --text: #e8ebf0; --muted: #9aa4b2; --line: #2d353f;
    --accent: #f0935a; --accent-text: #14202b; --danger: #e5646a; --ok: #5cc48a; --field: #151a20;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
body { display: flex; }
nav { width: 220px; flex: none; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--panel); }
nav h1 { font-size: 15px; margin: 0 8px 4px; }
nav .conn { margin: 0 8px 16px; font-size: 12px; color: var(--muted); }
nav .conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; background: var(--muted); vertical-align: 1px; }
nav .conn.on::before { background: var(--ok); }
nav button { display: block; width: 100%; text-align: left; padding: 9px 12px; margin: 2px 0; border: 0;
  border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
nav button:hover { background: var(--bg); }
nav button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
main { flex: 1; overflow-y: auto; padding: 24px 32px 48px; }
section { display: none; max-width: 760px; }
section.active { display: block; }
h2 { font-size: 22px; margin: 0 0 18px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 18px; margin-bottom: 18px; }
.card h3 { font-size: 14px; margin: 14px 0 4px; }
.row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .label { flex: 1; }
.row .label small { display: block; color: var(--muted); margin-top: 2px; }
select, input[type=text], input[type=password], textarea {
  font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; }
select { min-width: 180px; }
textarea { width: 100%; min-height: 220px; font-family: Consolas, monospace; font-size: 13px; resize: vertical; }
button.b { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--field); color: var(--text); cursor: pointer; white-space: nowrap; }
button.b:hover { border-color: var(--accent); }
button.b.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.b:disabled { opacity: .5; cursor: default; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 11px; cursor: pointer; transition: .15s; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(18px); }
.swatches { display: flex; gap: 8px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch.sel { border-color: var(--text); }
.device { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.device:last-child { border-bottom: 0; }
.device .name { flex: 1; min-width: 0; }
.device .name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.device .name small { color: var(--muted); }
.device input[type=text] { width: 180px; }
.icon { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; width: 28px; height: 28px; border-radius: 6px; }
.icon:hover { background: var(--bg); color: var(--text); }
.icon:disabled { opacity: .3; cursor: default; }
.star.on { color: #e0aa2a; }
.places { margin: 4px 0 12px; }
.place { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 6px; margin: 4px 0; background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
.place:hover { border-color: var(--accent); }
.muted { color: var(--muted); }
.warn { background: color-mix(in srgb, var(--danger) 14%, transparent); border: 1px solid var(--danger);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; }
.mono { font-family: Consolas, monospace; word-break: break-all; }
#toast { position: fixed; bottom: 18px; right: 24px; padding: 10px 16px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.18);
  opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#toast.bad { border-color: var(--danger); }
input[type=range] { width: 200px; accent-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; max-width: 760px; }
.pic { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pic.current { border: 2px solid var(--accent); }
.thumb { width: 100%; aspect-ratio: 480 / 272; background-color: var(--bg); background-repeat: no-repeat; }
.pic .meta { padding: 8px 10px; }
.pic .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pic .meta small { color: var(--muted); }
.pic .acts { display: flex; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; align-items: center; }
.pic .acts label { display: flex; align-items: center; gap: 4px; margin-right: auto; font-size: 12px; color: var(--muted); }
.pic .acts button.b { padding: 4px 10px; font-size: 13px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--accent); color: var(--accent-text); margin-left: 6px; }
#cropper { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
#cropper.open { display: flex; }
#cropper .box { background: var(--panel); border-radius: 10px; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
#cropper h3 { margin: 0 0 4px; }
#frame { position: relative; width: 640px; height: 363px; overflow: hidden; background: #000; cursor: grab;
  border-radius: 6px; touch-action: none; user-select: none; }
#frame.drag { cursor: grabbing; }
#frame img { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; max-width: none; }
#cropper .tools { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
#cropper .tools input[type=range] { flex: 1; width: auto; }
#cropper .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<nav>
  <h1 data-t="title"></h1>
  <div class="conn" id="conn"></div>
  <button data-page="general" class="active" data-t="pGeneral"></button>
  <button data-page="display" data-t="pDisplay"></button>
  <button data-page="audio" data-t="pAudio"></button>
  <button data-page="dashboard" data-t="pDashboard"></button>
  <button data-page="pictures" data-t="pPictures"></button>
  <button data-page="claude" data-t="pClaude"></button>
  <button data-page="about" data-t="pAbout"></button>
</nav>
<main>
  <div class="warn" id="mismatch" hidden></div>

  <section id="general" class="active">
    <h2 data-t="pGeneral"></h2>
    <div class="card">
      <div class="row"><div class="label" data-t="language"></div>
        <select data-setting="language"><option value="0">Türkçe</option><option value="1">English</option></select></div>
      <div class="row"><div class="label"><span data-t="startupWin"></span><small data-t="startupWinHint"></small></div>
        <label class="switch"><input type="checkbox" id="startup"><span></span></label></div>
      <div class="row"><div class="label" data-t="startupScreen"></div>
        <select data-setting="startup_screen"><option value="0" data-t="sDashboard"></option>
          <option value="1" data-t="sAudio"></option><option value="2" data-t="sMusic"></option></select></div>
      <div class="row"><div class="label"><span data-t="timeout"></span><small data-t="timeoutHint"></small></div>
        <select data-setting="screen_timeout"><option value="0" data-t="never"></option>
          <option value="1" data-t="min1"></option><option value="5" data-t="min5"></option>
          <option value="15" data-t="min15"></option></select></div>
      <div class="row"><div class="label"><span data-t="flip"></span><small data-t="flipHint"></small></div>
        <label class="switch"><input type="checkbox" data-setting-bool="flipped"><span></span></label></div>
    </div>
  </section>

  <section id="display">
    <h2 data-t="pDisplay"></h2>
    <div class="card">
      <div class="row"><div class="label" data-t="theme"></div>
        <select data-setting="theme"><option value="0" data-t="dark"></option><option value="1" data-t="light"></option></select></div>
      <div class="row"><div class="label" data-t="accent"></div><div class="swatches" id="swatches"></div></div>
    </div>
    <div class="card">
      <h3 data-t="audioTab"></h3>
      <div class="row"><div class="label" data-t="layout"></div>
        <select data-setting="layout"><option value="0" data-t="lCards"></option>
          <option value="1" data-t="lList"></option><option value="2" data-t="lTile"></option></select></div>
      <div class="row"><div class="label" data-t="grid"></div>
        <select data-setting="grid"><option value="0">2 × 2</option><option value="1">2 × 3</option>
          <option value="2">3 × 3</option><option value="3" data-t="gList"></option></select></div>
      <div class="row"><div class="label" data-t="startupTab"></div>
        <select data-setting="startup_tab"><option value="0" data-t="tLast"></option>
          <option value="1" data-t="tAll"></option><option value="2" data-t="tFav"></option></select></div>
    </div>
  </section>

  <section id="audio">
    <h2 data-t="pAudio"></h2>
    <div class="card">
      <h3 data-t="devices"></h3>
      <p class="muted" data-t="devicesHint"></p>
      <div id="devices"></div>
    </div>
    <div class="card">
      <div class="row"><div class="label"><span data-t="limit"></span><small data-t="limitHint"></small></div>
        <label class="switch"><input type="checkbox" data-setting-bool="volume_limit_on"><span></span></label></div>
      <div class="row"><div class="label" data-t="limitValue"></div>
        <input type="range" min="0" max="100" step="1" id="limitValue"><span id="limitText" style="width:44px;text-align:right"></span></div>
    </div>
  </section>

  <section id="dashboard">
    <h2 data-t="pDashboard"></h2>
    <div class="card">
      <h3 data-t="weather"></h3>
      <div class="row"><div class="label"><span data-t="location"></span><small id="weatherNow"></small></div></div>
      <div class="row"><input type="text" id="city" style="flex:1"><button class="b" id="search" data-t="search"></button></div>
      <div class="places" id="places"></div>
    </div>
    <div class="card">
      <h3 data-t="menu"></h3>
      <div class="row"><div class="label"><span data-t="menuImport"></span><small data-t="menuImportHint"></small></div>
        <button class="b" id="menuImport" data-t="chooseImages"></button></div>
      <div class="row"><div class="label"><span data-t="claudeKey"></span><small id="claudeKeyNow"></small></div>
        <input type="password" id="claudeKey" style="width:220px" autocomplete="off">
        <button class="b" id="claudeKeySave" data-t="save"></button>
        <button class="b" id="claudeKeyRemove" data-t="remove"></button></div>
    </div>
    <div class="card">
      <h3 data-t="foodLists"></h3>
      <p class="muted" data-t="foodListsHint"></p>
      <textarea id="foodLists" spellcheck="false"></textarea>
      <div class="row" style="justify-content:flex-end"><button class="b primary" id="foodListsSave" data-t="save"></button></div>
    </div>
  </section>

  <section id="pictures">
    <h2 data-t="pPictures"></h2>
    <div class="card">
      <div class="row"><div class="label"><span data-t="picAdd"></span><small data-t="picAddHint"></small></div>
        <button class="b primary" id="picturesAdd" data-t="picAddButton"></button></div>
      <div class="row"><div class="label"><span data-t="shuffle"></span><small data-t="shuffleHint"></small></div>
        <label class="switch"><input type="checkbox" id="shuffleOn"><span></span></label></div>
      <div class="row"><div class="label" data-t="shuffleEvery"></div>
        <select id="shuffleMinutes"><option value="1">1 dk</option><option value="5">5 dk</option>
          <option value="10">10 dk</option><option value="15">15 dk</option><option value="30">30 dk</option>
          <option value="60">1 sa</option><option value="120">2 sa</option><option value="360">6 sa</option>
          <option value="1440">24 sa</option></select></div>
      <div class="row"><div class="label" data-t="shuffleOrder"></div>
        <select id="shuffleRandom"><option value="1" data-t="orderRandom"></option>
          <option value="0" data-t="orderList"></option></select></div>
      <div class="row"><div class="label"><span data-t="picNone"></span><small data-t="picNoneHint"></small></div>
        <button class="b" id="pictureNone" data-t="picNoneButton"></button></div>
    </div>
    <p class="muted" id="picEmpty" data-t="picEmpty"></p>
    <div class="grid" id="pictureGrid"></div>
  </section>

  <section id="claude">
    <h2 data-t="pClaude"></h2>
    <div class="card">
      <p data-t="hookText"></p>
      <div class="row"><div class="label"><span data-t="hookCopy"></span><small data-t="hookCopyHint"></small></div>
        <button class="b primary" id="copyHook" data-t="copy"></button></div>
    </div>
  </section>

  <section id="about">
    <h2 data-t="pAbout"></h2>
    <div class="card">
      <div class="row"><div class="label" data-t="program"></div><span class="mono" id="hostVersion"></span></div>
      <div class="row"><div class="label" data-t="firmware"></div><span class="mono" id="fwVersion"></span></div>
      <div class="row"><div class="label" data-t="connection"></div><span id="connText"></span></div>
    </div>
    <div class="card">
      <div class="row"><div class="label"><span data-t="folder"></span><small class="mono" id="folder"></small></div>
        <button class="b" id="openFolder" data-t="open"></button></div>
      <div class="row"><div class="label" data-t="log"></div><button class="b" id="openLog" data-t="open"></button></div>
    </div>
  </section>
</main>
<div id="cropper"><div class="box">
  <h3 data-t="cropTitle"></h3>
  <p class="muted" data-t="cropHint" style="margin:0 0 10px"></p>
  <div id="frame"><img id="cropImg" alt=""></div>
  <div class="tools"><button class="b" id="zoomOut">−</button>
    <input type="range" id="zoom" min="0" max="1000" value="0"><button class="b" id="zoomIn">+</button>
    <button class="b" id="cropReset" data-t="reset"></button></div>
  <div class="buttons"><button class="b" id="cropCancel" data-t="cancel"></button>
    <button class="b primary" id="cropSave" data-t="save"></button></div>
</div></div>
<div id="toast"></div>

<script>

  notConnected: ["kart bağlı değil", "board not connected"],
  protocol: ["protokol", "protocol"],
  mismatch: ["Kart protokol {b} konuşuyor, bu program {h}. {w} güncelleyin, yoksa kart ile program anlaşamaz.",
    "The board speaks protocol {b}, this program {h}. Update the {w}, or they cannot talk."],
  mFirmware: ["Firmware'i", "firmware"], mProgram: ["programı", "program"],
  folder: ["Ayarlar klasörü", "Settings folder"], log: ["Günlük (host.log)", "Log (host.log)"],
  saved: ["Kaydedildi.", "Saved."]
};
const ACCENTS = ["#e8833f", "#4a8bdb", "#34a86a", "#9672de", "#e0628e", "#e0aa2a"];
let state = null;
let lang = 0;

const $ = id => document.getElementById(id);
const t = (key, vars) => {
  let s = (TEXT[key] || [key, key])[lang] || "";
  for (const k in (vars || {})) s = s.replace("{" + k + "}", vars[k]);
  return s;
};
const send = obj => window.chrome.webview.postMessage(JSON.stringify(obj));

function toast(text, ok) {
  const el = $("toast");
  el.textContent = text;
  el.className = "show" + (ok === false ? " bad" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ""; }, 2600);
}

function translate() {
  document.documentElement.lang = lang ? "en" : "tr";
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("city").placeholder = t("cityPh");
  $("claudeKey").placeholder = t("keyPh");
}

function render() {
  const s = state;
  lang = s.settings.language === 1 ? 1 : 0;
  translate();
  const conn = $("conn");
  conn.textContent = t(s.connected ? "connected" : "waiting");
  conn.className = "conn" + (s.connected ? " on" : "");

  document.querySelectorAll("select[data-setting]").forEach(sel => {
    if (document.activeElement !== sel) sel.value = String(s.settings[sel.dataset.setting]);
  });
  document.querySelectorAll("input[data-setting-bool]").forEach(cb => { cb.checked = !!s.settings[cb.dataset.settingBool]; });
  $("startup").checked = s.startup;

  const sw = $("swatches");
  sw.textContent = "";
  ACCENTS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "swatch" + (s.settings.accent === i ? " sel" : "");
    b.style.background = c;
    b.onclick = () => setting("accent", i);
    sw.appendChild(b);
  });

  if (document.activeElement !== $("limitValue")) $("limitValue").value = s.settings.volume_limit;
  $("limitText").textContent = s.settings.volume_limit + "%";
  $("limitValue").disabled = !s.settings.volume_limit_on;

  renderDevices();

  $("weatherNow").textContent = s.weather
    ? (s.weather.name || "—") + " (" + s.weather.latitude.toFixed(4) + ", " + s.weather.longitude.toFixed(4) + ")"
    : t("noLocation");
  renderPictures();
  $("menuImport").disabled = s.importing;
  $("menuImport").textContent = t(s.importing ? "importing" : "chooseImages");
  $("claudeKeyNow").textContent = s.claudeKeySet ? t("keySet", { m: s.claudeModel }) : t("keyNotSet");
  $("claudeKeyRemove").disabled = !s.claudeKeySet;
  if (document.activeElement !== $("foodLists") && !$("foodLists").dataset.dirty) $("foodLists").value = s.foodLists;

  $("hostVersion").textContent = s.hostVersion + " · " + t("protocol") + " " + s.hostProtocol;
  $("fwVersion").textContent = !s.connected ? t("notConnected")
    : (s.firmware ? s.firmware + (s.boardProtocol ? " · " + t("protocol") + " " + s.boardProtocol : "") : t("fwOld"));
  $("connText").textContent = t(s.connected ? "connected" : "waiting");
  $("folder").textContent = s.folder;
  const mm = $("mismatch");
  if (s.connected && s.boardProtocol && s.boardProtocol !== s.hostProtocol) {
    mm.hidden = false;
    mm.textContent = t("mismatch", { b: s.boardProtocol, h: s.hostProtocol,
      w: t(s.boardProtocol < s.hostProtocol ? "mFirmware" : "mProgram") });
  } else {
    mm.hidden = true;
  }
}

function renderDevices() {
  const box = $("devices");
  // Do not disturb typing a name; a clicked button (↑ ↓ ★) must not stop the
  // list from showing the new order.
  const active = document.activeElement;
  if (active && active.tagName === "INPUT" && box.contains(active)) return;
  box.textContent = "";
  const list = state.devices;
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = t("noDevices");
    box.appendChild(p);
    return;
  }
  list.forEach((d, i) => {
    const row = document.createElement("div");
    row.className = "device";
    const star = document.createElement("button");
    star.className = "icon star" + (d.favorite ? " on" : "");
    star.textContent = d.favorite ? "★" : "☆";
    star.title = t("favorite");
    star.onclick = () => send({ cmd: "favorite", id: d.id, value: d.favorite ? 0 : 1 });
    const name = document.createElement("div");
    name.className = "name";
    const n = document.createElement("div");
    n.textContent = d.alias || d.name;
    const small = document.createElement("small");
    small.textContent = d.alias ? d.name : "";
    name.append(n, small);
    const alias = document.createElement("input");
    alias.type = "text";
    alias.maxLength = 32;
    alias.placeholder = t("aliasPh");
    alias.value = d.alias;
    const commit = () => { if (alias.value !== d.alias) send({ cmd: "alias", id: d.id, alias: alias.value.trim() }); };
    alias.onchange = commit;
    alias.onkeydown = e => { if (e.key === "Enter") alias.blur(); };
    const up = document.createElement("button");
    up.className = "icon"; up.textContent = "↑"; up.title = t("up"); up.disabled = i === 0;
    up.onclick = () => move(i, -1);
    const down = document.createElement("button");
    down.className = "icon"; down.textContent = "↓"; down.title = t("down"); down.disabled = i === list.length - 1;
    down.onclick = () => move(i, 1);
    row.append(star, name, alias, up, down);
    box.appendChild(row);
  });
}

function move(i, step) {
  const ids = state.devices.map(d => d.id);
  const j = i + step;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  send({ cmd: "order", ids });
}

function setting(name, value) {
  send({ cmd: "setting", name, value: Number(value) });
}

function renderPlaces(places) {
  const box = $("places");
  box.textContent = "";
  if (!places.length) {
    box.textContent = t("noPlaces");
    return;
  }
  places.forEach(p => {
    const b = document.createElement("button");
    b.className = "place";
    b.textContent = p.description || p.name;
    b.onclick = () => {
      send({ cmd: "weatherSet", name: p.name, latitude: p.latitude, longitude: p.longitude });
      box.textContent = "";
      $("city").value = "";
    };
    box.appendChild(b);
  });
}

// --- events
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section").forEach(s => s.classList.toggle("active", s.id === b.dataset.page));
  };
});
document.querySelectorAll("select[data-setting]").forEach(sel => {
  sel.onchange = () => setting(sel.dataset.setting, sel.value);
});
document.querySelectorAll("input[data-setting-bool]").forEach(cb => {
  cb.onchange = () => setting(cb.dataset.settingBool, cb.checked ? 1 : 0);
});
$("startup").onchange = e => send({ cmd: "startup", value: e.target.checked ? 1 : 0 });
$("limitValue").oninput = e => { $("limitText").textContent = e.target.value + "%"; };
$("limitValue").onchange = e => setting("volume_limit", e.target.value);
$("search").onclick = () => {
  const q = $("city").value.trim();
  if (!q) return;
  $("places").textContent = t("searching");
  send({ cmd: "weatherSearch", query: q });
};
$("city").onkeydown = e => { if (e.key === "Enter") $("search").click(); };
$("picturesAdd").onclick = () => send({ cmd: "picturesAdd" });
$("pictureNone").onclick = () => {
  sendShuffle({ enabled: false });
  send({ cmd: "pictureShow", id: "" });
};
$("shuffleOn").onchange = e => sendShuffle({ enabled: e.target.checked });
$("shuffleMinutes").onchange = e => sendShuffle({ minutes: Number(e.target.value) });
$("shuffleRandom").onchange = e => sendShuffle({ random: e.target.value === "1" });

function sendShuffle(change) {
  const s = Object.assign({}, state.shuffle, change);
  send({ cmd: "pictureShuffle", enabled: s.enabled, minutes: s.minutes, random: s.random });
}

// The cropped part as a CSS background: what goes to the board.
function thumbStyle(el, p) {
  const sx = 100 / p.crop.w, sy = 100 / p.crop.h;
  el.style.backgroundImage = "url(" + JSON.stringify(p.preview) + ")";
  el.style.backgroundSize = sx + "% " + sy + "%";
  el.style.backgroundPosition = (p.crop.w < 1 ? (p.crop.x / (1 - p.crop.w)) * 100 : 0) + "% " +
                                (p.crop.h < 1 ? (p.crop.y / (1 - p.crop.h)) * 100 : 0) + "%";
}

function renderPictures() {
  const s = state;
  $("shuffleOn").checked = s.shuffle.enabled;
  if (document.activeElement !== $("shuffleMinutes")) $("shuffleMinutes").value = String(s.shuffle.minutes);
  if (document.activeElement !== $("shuffleRandom")) $("shuffleRandom").value = s.shuffle.random ? "1" : "0";
  $("shuffleMinutes").disabled = $("shuffleRandom").disabled = !s.shuffle.enabled;
  $("pictureNone").disabled = !s.currentPicture && !s.shuffle.enabled;
  $("picEmpty").hidden = s.pictures.length > 0;
  const grid = $("pictureGrid");
  grid.textContent = "";
  s.pictures.forEach(p => {
    const card = document.createElement("div");
    card.className = "pic" + (p.id === s.currentPicture ? " current" : "");
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumbStyle(thumb, p);
    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.textContent = p.name || p.id;
    if (p.id === s.currentPicture) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = t("onBoard");
      name.appendChild(b);
    }
    const size = document.createElement("small");
    size.textContent = p.width + " × " + p.height;
    meta.append(name, size);
    const acts = document.createElement("div");
    acts.className = "acts";
    const inc = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = p.shuffle;
    cb.onchange = () => send({ cmd: "pictureInclude", id: p.id, value: cb.checked ? 1 : 0 });
    inc.append(cb, document.createTextNode(t("inShuffle")));
    const show = document.createElement("button");
    show.className = "b"; show.textContent = t("show"); show.disabled = p.id === s.currentPicture;
    show.onclick = () => send({ cmd: "pictureShow", id: p.id });
    const crop = document.createElement("button");
    crop.className = "b"; crop.textContent = t("crop");
    crop.onclick = () => openCropper(p);
    const del = document.createElement("button");
    del.className = "b"; del.textContent = t("del");
    del.onclick = () => { if (confirm(t("delAsk", { n: p.name || p.id }))) send({ cmd: "pictureRemove", id: p.id }); };
    acts.append(inc, show, crop, del);
    card.append(thumb, meta, acts);
    grid.appendChild(card);
  });
}

// --- the cropper: the frame is the board's 480:272; the image is moved and
// scaled under it; what the frame shows is the part sent to the board.
const crop = { pic: null, iw: 0, ih: 0, scale: 1, min: 1, max: 1, x: 0, y: 0 };
const FW = 640, FH = 363;

function cropClamp() {
  crop.scale = Math.min(crop.max, Math.max(crop.min, crop.scale));
  const w = crop.iw * crop.scale, h = crop.ih * crop.scale;
  crop.x = Math.min(0, Math.max(FW - w, crop.x));
  crop.y = Math.min(0, Math.max(FH - h, crop.y));
  const img = $("cropImg");
  img.style.transform = "translate(" + crop.x + "px," + crop.y + "px) scale(" + crop.scale + ")";
  $("zoom").value = String(Math.round(1000 * Math.log(crop.scale / crop.min) / Math.log(crop.max / crop.min || 2)));
}

function zoomAt(scale, cx, cy) {
  const old = crop.scale;
  crop.scale = Math.min(crop.max, Math.max(crop.min, scale));
  crop.x = cx - (cx - crop.x) * crop.scale / old;
  crop.y = cy - (cy - crop.y) * crop.scale / old;
  cropClamp();
}

function cropFrom(rect) {
  crop.scale = FW / (rect.w * crop.iw);
  crop.x = -rect.x * crop.iw * crop.scale;
  crop.y = -rect.y * crop.ih * crop.scale;
  cropClamp();
}

function openCropper(p) {
  const img = $("cropImg");
  crop.pic = p;
  img.onload = () => {
    crop.iw = img.naturalWidth; crop.ih = img.naturalHeight;
    crop.min = Math.max(FW / crop.iw, FH / crop.ih);
    crop.max = crop.min * 8;
    cropFrom(p.crop);
  };
  img.src = p.preview;
  $("cropper").classList.add("open");
}

function centredCrop() {
  // The largest centred 480:272 part.
  const aspect = 480 / 272, a = crop.iw / crop.ih;
  const w = a > aspect ? aspect / a : 1, h = a > aspect ? 1 : a / aspect;
  return { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
}

(function cropEvents() {
  const frame = $("frame");
  let drag = null;
  frame.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; frame.setPointerCapture(e.pointerId); frame.classList.add("drag"); };
  frame.onpointermove = e => {
    if (!drag) return;
    crop.x += e.clientX - drag.x; crop.y += e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    cropClamp();
  };
  frame.onpointerup = frame.onpointercancel = () => { drag = null; frame.classList.remove("drag"); };
  frame.onwheel = e => {
    e.preventDefault();
    const r = frame.getBoundingClientRect();
    zoomAt(crop.scale * Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top);
  };
  $("zoom").oninput = e => zoomAt(crop.min * Math.pow(crop.max / crop.min, Number(e.target.value) / 1000), FW / 2, FH / 2);
  $("zoomIn").onclick = () => zoomAt(crop.scale * 1.25, FW / 2, FH / 2);
  $("zoomOut").onclick = () => zoomAt(crop.scale / 1.25, FW / 2, FH / 2);
  $("cropReset").onclick = () => cropFrom(centredCrop());
  $("cropCancel").onclick = () => $("cropper").classList.remove("open");
  $("cropSave").onclick = () => {
    const w = FW / (crop.iw * crop.scale), h = FH / (crop.ih * crop.scale);
    const x = Math.min(1 - w, Math.max(0, -crop.x / (crop.iw * crop.scale)));
    const y = Math.min(1 - h, Math.max(0, -crop.y / (crop.ih * crop.scale)));
    send({ cmd: "pictureCrop", id: crop.pic.id, x, y, w, h });
    $("cropper").classList.remove("open");
  };
})();
$("menuImport").onclick = () => send({ cmd: "menuImport" });
$("claudeKeySave").onclick = () => {
  const key = $("claudeKey").value.trim();
  if (!key) return;
  send({ cmd: "claudeKey", key });
  $("claudeKey").value = "";
};
$("claudeKeyRemove").onclick = () => send({ cmd: "claudeKey", key: "" });
$("foodLists").oninput = () => { $("foodLists").dataset.dirty = "1"; };
$("foodListsSave").onclick = () => {
  delete $("foodLists").dataset.dirty;
  send({ cmd: "foodLists", text: $("foodLists").value });
};
$("copyHook").onclick = () => send({ cmd: "copyHook" });
$("openFolder").onclick = () => send({ cmd: "openFolder" });
$("openLog").onclick = () => send({ cmd: "openLog" });

window.chrome.webview.addEventListener("message", e => {
  let m;
  try { m = JSON.parse(e.data); } catch (err) { return; }
  if (m.type === "state") { state = m; render(); }
  else if (m.type === "places") renderPlaces(m.places);
  else if (m.type === "notice") toast(m.text, m.ok);
});
translate();
send({ cmd: "get" });
</script>
</body>
</html>
